esphome:
  name: sonic
  friendly_name: "Ультразвуковой датчик расстояния"

esp8266:
  board: d1_mini

# Enable logging
logger:
  baud_rate: 0
  hardware_uart: UART0  # явно указываем, что используем UART0, но с baud_rate 0
  level: DEBUG  # логи будут выводиться через другие каналы (WiFi, USB)
 # level: WARN  # после тестирования, комментируем строчку выше и раскомментируем эту

# Enable Home Assistant API
api:
  encryption:
    key:  !secret api_encryption_key

ota:
  - platform: esphome
    password: "укажите свой пароль"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  min_auth_mode: WPA2

uart:
  id: uart_ultrasonic
  tx_pin: GPIO1  # Пин, соединенный с RX датчика (опционально)
  rx_pin: GPIO3  # Пин, соединенный с TX датчика
  baud_rate: 9600
  stop_bits: 1

# Глобальная переменная для счётчика
globals:
  - id: last_raw_value
    type: float
    restore_value: false
    initial_value: '-1.0'
  - id: last_change_timestamp
    type: int
    restore_value: false
    initial_value: '0' 

# Получаем время от Home Assistant
time:
  - platform: homeassistant
    id: ha_time

# Создаём сенсор для обработки данных
sensor:
  - platform: jsn_sr04t   # ESPHome также поддерживает AJ_SR04M через эту платформу
    model: aj_sr04m       # Указываем модель датчика [citation:2]
    name: "Расстояние до воды"
    unit_of_measurement: "м"
    accuracy_decimals: 2
    update_interval: 5s   # Запрашиваем данные каждые 5 секунд
    uart_id: uart_ultrasonic
    filters:
          # МЕДИАННЫЙ ФИЛЬТР - удаляет случайные выбросы (например, от капель или помех)
          # Принцип: накапливает N измерений, сортирует их, берёт среднее значение      
      - median:
          window_size: 10    # Размер окна: сколько измерений накопить для расчёта (5 шт. × 5с = 25 секунд данных)
          send_every: 5     # Отправлять результат каждые 5 измерений (то есть каждые 25 секунд)
                            # Пример: было [1.20, 1.21, 5.80, 1.19, 1.20] → после сортировки [1.19,1.20,1.20,1.21,5.80] → медиана = 1.20 (выброс 5.80 отброшен)
          # ФИЛЬТР ОГРАНИЧЕНИЯ ЧАСТОТЫ - не отправляет значения слишком часто
          # Даже если медиана выдаёт результат каждую секунду, throttle ограничит отправку
      - throttle: 10s       # Отправлять в Home Assistant не чаще чем 1 раз в 10 секунд
                            # (при текущих настройках медиана выдаёт результат раз в 25с, поэтому throttle не блокирует отправку)
    on_value:
      then:
        # Проверяем, изменилось ли значение
        - if:
            condition:
              lambda: |-
                float current = id(raw_distance).state;
                float last = id(last_raw_value);
                // При первом запуске last = -1.0
                if (last < 0) return false;
                return abs(current - last) > 0.001;
            then:
              # Обновляем timestamp ТОЛЬКО при изменении
              - globals.set:
                  id: last_change_timestamp
                  value: !lambda 'return id(ha_time).now().timestamp;'
              
              # Обновляем сенсор с временем изменения
              - sensor.template.publish:
                  id: last_change_time_sensor
                  state: !lambda 'return id(last_change_timestamp);'
        
        # Сохраняем текущее значение для следующего сравнения (ВСЕГДА)
        - globals.set:
            id: last_raw_value
            value: !lambda 'return id(raw_distance).state;'

  # Сенсор для отображения времени последнего изменения (Unix timestamp)
  - platform: template
    name: "Время последнего изменения (timestamp)"
    id: last_change_time_sensor
    lambda: |-
      return id(last_change_timestamp);
    update_interval: never
    entity_category: diagnostic
    unit_of_measurement: "сек"
    icon: "mdi:clock"
    accuracy_decimals: 0
    filters:
      - throttle: 20s

  # Дополнительно: сколько времени прошло с последнего изменения
  - platform: template
    name: "Секунд с последнего изменения"
    id: seconds_since_last_change
    lambda: |-
      if (id(last_change_timestamp) > 0) {
        time_t now = id(ha_time).now().timestamp;
        return (now - id(last_change_timestamp));
      } else {
        return -1.0;
      }
    update_interval: 5s
    entity_category: diagnostic
    unit_of_measurement: "с"
    accuracy_decimals: 0
    icon: "mdi:timer"
    filters:
      - throttle: 20s  
            
# Диагностика
  - platform: wifi_signal
    name: "WiFi сигнал"
    update_interval: 60s
    entity_category: diagnostic

  - platform: uptime
    name: "Аптайм"
    entity_category: diagnostic

binary_sensor:
  - platform: status
    name: "Статус устройства"
    entity_category: diagnostic
